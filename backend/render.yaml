services:
  - type: web
    name: digital-citizen-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app/db/seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-citizen-db
          property: connectionString
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false

databases:
  - name: digital-citizen-db
    databaseName: digital_citizen_db
    user: citizen_admin
